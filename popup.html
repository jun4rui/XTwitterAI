<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>X Tweet Translator</title>
    <style>
        body {
            width: 250px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 18px;
            margin: 0;
            color: #1da1f2;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        label {
            font-size: 14px;
            color: #333;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #1da1f2;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .status {
            text-align: center;
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .enabled {
            background-color: #d4edda;
            color: #155724;
        }
        
        .disabled {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .info {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>X Tweet Translator</h1>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label for="translationToggle">启用翻译:</label>
            <label class="switch">
                <input type="checkbox" id="translationToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <div id="status" class="status enabled">翻译功能已启用</div>
        
        <div class="control-group" style="margin-top: 15px;">
            <button id="downloadModelsBtn" style="background-color: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%;">
                准备就绪
            </button>
        </div>
    </div>
    
    <div class="info">
        刷新X (Twitter)页面以应用更改<br>
        当前版本: 3.4
    </div>

    <script src="popup.js"></script>
</body>
</html>
